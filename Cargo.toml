[workspace]
resolver = "2"
members = [
    "contracts/shared",
    "contracts/offer-book",
    "contracts/checkout-gate",
    "contracts/agent-account",
    "contracts/integration-tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/<owner>/loyal-cart"

[workspace.dependencies]
near-sdk = "5.30.1"
near-contract-standards = "5.30.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
borsh = { version = "1.5", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
